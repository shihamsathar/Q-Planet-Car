# Render Blueprint Configuration (render.yaml)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Q Planet Car Care - Frontend Web Application (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: qplanet-car-care
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    autoDeploy: true

    # SPA Client-Side Routing: rewrite all routes to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: VITE_APP_NAME
        value: "Q Planet Car Care & Auto Detailing"
      - key: VITE_APP_ENV
        value: production

