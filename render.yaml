# Render Blueprint Specification (render.yaml)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Q Planet Car Care & Auto Detailing - Production Web App (Static SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: qplanet-car-care
    runtime: static
    env: static
    plan: free
    region: frankfurt # Can be oregon, ohio, frankfurt, or singapore
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false

    # Single Page Application (SPA) routing:
    # Rewrites all requests to /index.html for client-side routing
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Security & performance response headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    # Build & runtime environment variables
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: VITE_APP_NAME
        value: "Q Planet Car Care & Auto Detailing"
      - key: VITE_APP_ENV
        value: production
