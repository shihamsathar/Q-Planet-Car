# Render Blueprint Configuration (render.yaml)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. Q Planet Car Care - Frontend Web Application (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: qplanet-car-care
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    pullRequestPreviewsEnabled: true

    # SPA Client-Side Routing: rewrite all routes to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_APP_NAME
        value: "Q Planet Car Care & Auto Detailing"
      - key: VITE_APP_ENV
        value: production

  # ---------------------------------------------------------------------------
  # Optional: Uncomment if deploying with a dedicated Express/Node backend service
  # ---------------------------------------------------------------------------
  # - type: web
  #   name: qplanet-api-server
  #   runtime: node
  #   plan: starter
  #   buildCommand: npm install && npm run build
  #   startCommand: npm start
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: qplanet-postgres
  #         property: connectionString

# -----------------------------------------------------------------------------
# Optional: Managed PostgreSQL Database for Q Planet on Render
# -----------------------------------------------------------------------------
databases:
  - name: qplanet-postgres
    databaseName: qplanet_db
    user: qplanet_admin
    plan: free # Can be upgraded to starter/standard for production
    ipAllowList: [] # Allow connections from all Render services
